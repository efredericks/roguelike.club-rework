{% if page.mediaplayer == true %}
<script>
    $('audio,video').mediaelementplayer();
</script>
{% endif %}


<script src="{{ site.url }}{{ site.baseurl }}/assets/js/javascript.min.js"></script>


{% if page.header.image_fullwidth %}
<script>
    /*
    // tweak to randomize images
    var headerImages = {{ page.header.image_fullwidth | jsonify }};
    var randomImage = "{{ site.urlimg }}" + headerImages[Math.floor(Math.random() * headerImages.length)];
    $("#masthead").backstretch(randomImage, { fade: 700 });
    $("#masthead-with-text").backstretch(randomImage, { fade: 700 });
    */

    /* cycle through images */
    var headerImages = {{ page.header.image_fullwidth | jsonify }};
    var base = "{{ site.urlimg }}";
    var fullPaths = headerImages.map(function (img) { return base + img; });

    $("#masthead").backstretch(fullPaths, { fade: 700, duration: 4000 });
    $("#masthead-with-text").backstretch(fullPaths, { fade: 700, duration: 4000 });

    /*
    $("#masthead").backstretch("{{ site.urlimg }}{{ page.header.image_fullwidth }}", {fade: 700});
    $("#masthead-with-text").backstretch("{{ site.urlimg }}{{ page.header.image_fullwidth }}", {fade: 700});
    */
</script>
{% endif %}





{% comment %}
# Start of Tawk.to Script
#
# More information in _config.yml
#
{% endcomment %}
{% if site.tawkto_embed_uri and page.tawkto == true %}
<script type="text/javascript">
    var $_Tawk_API = {}, $_Tawk_LoadStart = new Date();
    (function () {
        var s1 = document.createElement("script"), s0 = document.getElementsByTagName("script")[0];
        s1.async = true;
        s1.src = '{{ site.tawkto_embed_uri }}';
        s1.charset = 'UTF-8';
        s1.setAttribute('crossorigin', '*');
        s0.parentNode.insertBefore(s1, s0);
    })();
</script>
{% endif %}
